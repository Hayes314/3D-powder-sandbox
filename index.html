  bindEvents() {
    window.addEventListener('resize', () => this.handleResize());

    this.canvas.addEventListener('pointerdown', e => {
      this.audio.init();
      this.pointer.down = true;
      this.pointer.button = e.button;
      this.pointer.lastX = e.clientX;
      this.pointer.lastY = e.clientY;

      if (e.button === 2 || this.selectedTool === 'orbit') {
        this.canvas.style.cursor = 'grabbing';
        return;
      }

      this.sim.saveSnapshot();
      const hitInfo = this.renderer.raycastVoxel(e.clientX, e.clientY, this.sim, this.buildPlaneY, this.lockPlane);
      if (hitInfo) {
        const target = (this.selectedTool === 'brush') ? hitInfo.place : hitInfo.hit;
        this.pointer.cursor3D = target;
        this.apply3DToolAt(target, false);
      }
    });

    window.addEventListener('pointermove', e => {
      const dx = e.clientX - this.pointer.lastX;
      const dy = e.clientY - this.pointer.lastY;
      this.pointer.lastX = e.clientX;
      this.pointer.lastY = e.clientY;

      if (this.pointer.down && (this.pointer.button === 2 || this.selectedTool === 'orbit')) {
        this.renderer.yaw -= dx * 0.008;
        this.renderer.pitch = Math.max(-1.45, Math.min(1.45, this.renderer.pitch + dy * 0.008));
        return;
      }

      const hitInfo = this.renderer.raycastVoxel(e.clientX, e.clientY, this.sim, this.buildPlaneY, this.lockPlane);
      if (hitInfo) {
        const target = (this.selectedTool === 'brush') ? hitInfo.place : hitInfo.hit;
        this.pointer.cursor3D = target;

        if (this.pointer.down && this.pointer.button === 0) {
          this.apply3DToolAt(target, true);
        }

        const [gx, gy, gz] = hitInfo.hit;
        const idx = this.sim.idx(gx, gy, gz);
        const id = this.sim.type[idx];
        const name = id === 0 ? this.t('vacuum') : this.t('el_' + EL_MAP[id].key);
        const temp = Math.round(this.sim.temp[idx]);
        const planeTag = this.lockPlane ? ` [平面鎖定 Y=${this.buildPlaneY}]` : '';
        document.getElementById('hover-inspector').textContent = `[X:${gx}, Y:${gy}, Z:${gz}] ${name} · ${temp}°C${planeTag}`;
      } else {
        this.pointer.cursor3D = null;
      }
    });

    window.addEventListener('pointerup', () => {
      this.pointer.down = false;
      this.canvas.style.cursor = this.selectedTool === 'orbit' ? 'grab' : 'crosshair';
    });

    this.canvas.addEventListener('contextmenu', e => e.preventDefault());

    window.addEventListener('wheel', e => {
      if (document.getElementById('modal-backdrop').classList.contains('open')) return;
      if (e.altKey) {
        e.preventDefault();
        const nextY = Math.max(0, Math.min(this.sim.size - 1, this.buildPlaneY + (e.deltaY < 0 ? 1 : -1)));
        this.buildPlaneY = nextY;
        document.getElementById('plane-y-slider').value = nextY;
        document.getElementById('plane-y-val').textContent = nextY;
      } else if (e.shiftKey) {
        this.brushSize = Math.max(1, Math.min(10, this.brushSize + (e.deltaY < 0 ? 1 : -1)));
        document.getElementById('brush-slider').value = this.brushSize;
        document.getElementById('brush-val').textContent = this.brushSize;
      } else {
        this.renderer.distance = Math.max(24, Math.min(170, this.renderer.distance + e.deltaY * 0.05));
      }
    }, { passive: false });

    window.addEventListener('keydown', e => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
      const k = e.key.toLowerCase();
      if (k === 'p') this.togglePause();
      else if (k === 'l') this.toggleLockPlane();
      else if (k === 'r') {
        this.audio.playClick();
        this.activePrintJob = null;
        document.getElementById('printer-banner').classList.remove('visible');
        this.sim.clear();
      }
      else if (k === 'e') this.setTool('erase');
      else if (k === 'b') this.setTool('brush');
      else if (k === 'v') this.setTool('orbit');
      else if (k === 'i') this.setTool('eyedropper');
      else if (k === '[') {
        this.brushSize = Math.max(1, this.brushSize - 1);
        document.getElementById('brush-slider').value = this.brushSize;
        document.getElementById('brush-val').textContent = this.brushSize;
      } else if (k === ']') {
        this.brushSize = Math.min(10, this.brushSize + 1);
        document.getElementById('brush-slider').value = this.brushSize;
        document.getElementById('brush-val').textContent = this.brushSize;
      } else if ((e.ctrlKey || e.metaKey) && k === 'z') {
        e.preventDefault();
        if (this.sim.undo()) this.audio.playClick();
      } else if ((e.ctrlKey || e.metaKey) && k === 'y') {
        e.preventDefault();
        if (this.sim.redo()) this.audio.playClick();
      }
    });

    document.querySelectorAll('#tools-dock .tool-btn[data-tool]').forEach(btn => {
      btn.onclick = () => { this.audio.playClick(); this.setTool(btn.getAttribute('data-tool')); };
    });
    document.getElementById('btn-undo').onclick = () => { if (this.sim.undo()) this.audio.playClick(); };
    document.getElementById('btn-redo').onclick = () => { if (this.sim.redo()) this.audio.playClick(); };
    document.getElementById('btn-reset').onclick = () => {
      this.audio.playClick();
      this.activePrintJob = null;
      document.getElementById('printer-banner').classList.remove('visible');
      if (this.mode === 'trial' && this.activeTrial) this.startTrial(this.activeTrial);
      else this.sim.clear();
    };

    document.querySelectorAll('.speed-btn').forEach(btn => {
      btn.onclick = () => {
        this.audio.playClick();
        this.simSpeed = parseFloat(btn.getAttribute('data-speed'));
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.toggle('active', b === btn));
      };
    });

    document.getElementById('btn-cam-reset').onclick = () => {
      this.audio.playClick();
      this.renderer.yaw = 0.68;
      this.renderer.pitch = 0.56;
      this.renderer.distance = 82;
    };
    document.getElementById('btn-apoc-blackhole').onclick = () => this.triggerApocalypse('blackhole');
    document.getElementById('btn-apoc-nova').onclick = () => this.triggerApocalypse('nova');
    document.getElementById('btn-apoc-rain').onclick = () => this.triggerApocalypse('rain');

    document.getElementById('btn-lock-plane').onclick = () => this.toggleLockPlane();

    document.getElementById('plane-y-slider').oninput = e => {
      this.buildPlaneY = parseInt(e.target.value, 10);
      document.getElementById('plane-y-val').textContent = this.buildPlaneY;
      if (!this.lockPlane) this.toggleLockPlane();
    };
    document.getElementById('slice-y-slider').oninput = e => {
      this.sliceY = parseInt(e.target.value, 10);
      document.getElementById('slice-y-val').textContent = this.sliceY;
    };
    document.getElementById('btn-infill').onclick = e => {
      this.audio.playClick();
      const levels = [100, 50, 25, 0];
      const next = levels[(levels.indexOf(this.infillPercent) + 1) % levels.length];
      this.infillPercent = next;
      e.target.textContent = `🧱 填充: ${next}%`;
    };
    document.getElementById('btn-print-speed').onclick = e => {
      this.audio.playClick();
      const speeds = [1, 4, 12];
      const next = speeds[(speeds.indexOf(this.printSpeed) + 1) % speeds.length];
      this.printSpeed = next;
      e.target.textContent = `⚡ 噴速: ${next}x`;
    };
    document.getElementById('btn-auto-rotate').onclick = e => {
      this.audio.playClick();
      this.renderer.autoRotate = !this.renderer.autoRotate;
      e.target.classList.toggle('active', this.renderer.autoRotate);
    };

    document.getElementById('btn-print-pause').onclick = e => {
      if (!this.activePrintJob) return;
      this.audio.playClick();
      this.activePrintJob.paused = !this.activePrintJob.paused;
      e.target.textContent = this.activePrintJob.paused ? '▶️' : '⏸';
    };
    document.getElementById('btn-print-cancel').onclick = () => {
      this.audio.playClick();
      this.activePrintJob = null;
      document.getElementById('printer-banner').classList.remove('visible');
    };

    document.querySelectorAll('.cat-tab').forEach(tab => {
      tab.onclick = () => {
        this.audio.playClick();
        this.selectedCat = tab.getAttribute('data-cat');
        document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t === tab));
        this.renderElementStrip();
      };
    });

    document.getElementById('place-mode-select').onchange = e => {
      this.audio.playClick();
      this.placeMode = e.target.value;
      this.extrudeAnchor = null;
      this.setTool('brush');
      if (this.placeMode === 'printer' && (this.shapeMode === 'brush_sphere' || this.shapeMode === 'brush_flat_disc')) {
        this.shapeMode = 'stamp_pyramid';
        document.getElementById('shape-select').value = 'stamp_pyramid';
        if (this.brushSize < 4) {
          this.brushSize = 4;
          document.getElementById('brush-slider').value = 4;
          document.getElementById('brush-val').textContent = 4;
        }
      }
    };

    document.getElementById('shape-select').onchange = e => {
      this.audio.playClick();
      this.shapeMode = e.target.value;
      this.setTool('brush');
      if (this.shapeMode.startsWith('stamp_') && this.brushSize < 3) {
        this.brushSize = 4;
        document.getElementById('brush-slider').value = 4;
        document.getElementById('brush-val').textContent = 4;
      }
    };

    document.getElementById('brush-slider').oninput = e => {
      this.brushSize = parseInt(e.target.value, 10);
      document.getElementById('brush-val').textContent = this.brushSize;
    };

    document.getElementById('btn-gravity-dir').onclick = e => {
      this.audio.playClick();
      this.sim.gravityDir = this.sim.gravityDir === 1 ? -1 : (this.sim.gravityDir === -1 ? 0 : 1);
      e.target.textContent = this.sim.gravityDir === 1 ? '⬇ G' : (this.sim.gravityDir === -1 ? '⬆ G' : '◎ 0G');
    };

    document.getElementById('btn-codex').onclick = () => { this.audio.playClick(); this.openCodexModal(); };
    document.getElementById('btn-trials').onclick = () => { this.audio.playClick(); this.openModesModal(); };
    document.getElementById('btn-mode').onclick = () => { this.audio.playClick(); this.openModesModal(); };
    document.getElementById('btn-achievements').onclick = () => { this.audio.playClick(); this.openAchievementsModal(); };
    document.getElementById('btn-settings').onclick = () => { this.audio.playClick(); this.openSettingsModal(); };
    document.getElementById('modal-close').onclick = () => { this.audio.playClick(); this.closeModal(); };
    document.getElementById('modal-backdrop').onclick = e => { if (e.target.id === 'modal-backdrop') this.closeModal(); };

    document.getElementById('btn-mute').onclick = e => {
      this.audio.muted = !this.audio.muted;
      this.audio.updateVolumes();
      e.target.textContent = this.audio.muted ? '🔇' : '🔊';
    };

    document.getElementById('btn-pause').onclick = () => this.togglePause();

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (this.audio.ctx && this.audio.ctx.state === 'running') this.audio.ctx.suspend();
        if (this.saveMgr.data.autoPause && this.state === 'PLAYING') {
          this.state = 'PAUSED';
          document.getElementById('btn-pause').textContent = '▶️';
        }
      } else {
        if (this.audio.ctx && !this.audio.muted) this.audio.ctx.resume();
      }
    });
  }

  togglePause() {
    this.audio.playClick();
    this.state = this.state === 'PLAYING' ? 'PAUSED' : 'PLAYING';
    document.getElementById('btn-pause').textContent = this.state === 'PAUSED' ? '▶️' : '⏸';
  }

  handleReactionEvent(gx, gy, gz, resultElId, sourceElId, isExplosion = false) {
    this.saveMgr.data.stats.totalReactions++;
    this.combo++;
    this.comboTimer = 1.6;
    if (this.combo > this.saveMgr.data.stats.maxCombo) this.saveMgr.data.stats.maxCombo = this.combo;

    this.saveMgr.data.aether += this.overdrive ? 2 : 1;
    if (resultElId > 0) this.unlockElement(resultElId);

    if (isExplosion) {
      this.sim.explode3D(gx, gy, gz, 5);
      this.audio.playExplosion();
      this.shakeTime = 0.35;
      this.shakeIntensity = 0.03 * this.saveMgr.data.shake;
    } else if (Math.random() < 0.22) {
      this.audio.playReaction(this.combo);
    }

    if (this.combo === 15 && !this.overdrive) {
      this.overdrive = true;
      this.showToast('🔥 GENESIS OVERDRIVE x2!');
    }
  }

  update(dt) {
    this.frameCount++;
    this.fpsTimer += dt;
    if (this.fpsTimer >= 0.5) {
      this.fps = Math.round(this.frameCount / this.fpsTimer);
      document.getElementById('hud-fps').textContent = this.fps;
      this.frameCount = 0;
      this.fpsTimer = 0;
    }

    if (this.renderer.autoRotate) {
      this.renderer.yaw += dt * 0.35;
    }

    if (this.shakeTime > 0) {
      this.shakeTime -= dt;
      if (this.shakeTime <= 0) this.shakeIntensity = 0;
    }

    if (this.state === 'PAUSED') return;

    if (this.activePrintJob) {
      this.stepActivePrintJob();
    }

    if (this.comboTimer > 0) {
      this.comboTimer -= dt;
      if (this.comboTimer <= 0) {
        this.combo = 0;
        this.overdrive = false;
      }
    }

    this.speedAccumulator += this.simSpeed;
    let simStats = null;
    while (this.speedAccumulator >= 1) {
      this.speedAccumulator -= 1;
      simStats = this.sim.step((x, y, z, res, src, exp) => this.handleReactionEvent(x, y, z, res, src, exp));
    }

    if (simStats) {
      document.getElementById('hud-voxels').textContent = simStats.activeCount;
      document.getElementById('hud-temp').textContent = simStats.avgTemp + '°C';
      this.critical = simStats.avgTemp > 220 || (simStats.counts[21] + simStats.counts[23]) > 45;

      if ((this.mode === 'trial' || this.mode === 'daily') && this.activeTrial) {
        this.trialTimeLeft -= dt;
        const current = simStats.counts[this.activeTrial.targetEl] || 0;
        const pct = Math.min(100, (current / this.activeTrial.targetCount) * 100);
        document.getElementById('trial-fill').style.width = pct + '%';
        document.getElementById('trial-timer').textContent = Math.max(0, Math.ceil(this.trialTimeLeft)) + 's';

        if (current >= this.activeTrial.targetCount) {
          this.showToast(this.t('trial_win'));
          this.audio.playDiscovery();
          this.saveMgr.data.aether += 250;
          if (typeof this.activeTrial.id === 'number' && !this.saveMgr.data.clearedTrials.includes(this.activeTrial.id)) {
            this.saveMgr.data.clearedTrials.push(this.activeTrial.id);
          }
          this.saveMgr.data.stats.trialsCleared++;
          this.saveMgr.save();
          this.checkAchievements();
          this.mode = 'sandbox';
          this.activeTrial = null;
          this.updateTrialBanner();
        } else if (this.trialTimeLeft <= 0) {
          this.showToast(this.t('trial_fail'));
          this.mode = 'sandbox';
          this.activeTrial = null;
          this.updateTrialBanner();
        }
      }
    }

    this.displayAether += (this.saveMgr.data.aether - this.displayAether) * 0.15;
    document.getElementById('hud-aether').textContent = Math.round(this.displayAether);

    const vig = document.getElementById('screen-vignette');
    vig.classList.toggle('overdrive', this.overdrive);
    vig.classList.toggle('critical', !this.overdrive && this.critical);
  }

  loop(now) {
    const dt = Math.min(0.05, (now - this.lastTime) / 1000);
    this.lastTime = now;
    this.update(dt);

    const shakeOffset = this.shakeIntensity > 0
      ? [(Math.random() - 0.5) * this.shakeIntensity, (Math.random() - 0.5) * this.shakeIntensity]
      : [0, 0];

    this.renderer.render(
      this.sim,
      this.sliceY,
      this.buildPlaneY,
      this.lockPlane,
      this.pointer.cursor3D,
      this.brushSize,
      this.shapeMode,
      this.placeMode,
      this.extrudeAnchor,
      this.activePrintJob,
      THEMES[this.saveMgr.data.theme] || THEMES.neon,
      shakeOffset
    );
    requestAnimationFrame(t => this.loop(t));
  }
}

const game = new Aetheria3DGame();
</script>
</body>
</html>

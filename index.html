<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>造物主紀元 3D：體素星海 | AETHERIA 3D Voxel Powder Cosmos</title>
<style>
  :root {
    --bg-canvas: #060914;
    --bg-hud: rgba(12, 19, 36, 0.78);
    --bg-panel: rgba(16, 25, 46, 0.94);
    --bg-btn: rgba(255, 255, 255, 0.07);
    --bg-btn-hover: rgba(255, 255, 255, 0.16);
    --border-glass: rgba(255, 255, 255, 0.15);
    --text-main: #F1F5F9;
    --text-muted: #94A3B8;
    --accent-primary: #00F0FF;
    --accent-secondary: #FF2A85;
    --accent-gold: #FFD166;
    --shadow-glow: 0 8px 32px rgba(0, 0, 0, 0.5);
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background-color: var(--bg-canvas);
    color: var(--text-main);
    font-family: var(--font-sans);
    touch-action: none;
    overscroll-behavior: none;
    transition: background-color 0.45s ease, color 0.35s ease;
  }

  #gl-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
    cursor: crosshair;
  }

  #screen-vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    transition: box-shadow 0.3s ease;
  }
  #screen-vignette.overdrive {
    box-shadow: inset 0 0 70px rgba(255, 209, 102, 0.42);
    animation: pulseGold 1.4s infinite alternate;
  }
  #screen-vignette.critical {
    box-shadow: inset 0 0 75px rgba(255, 42, 85, 0.48);
    animation: pulseRed 0.7s infinite alternate;
  }
  @keyframes pulseGold {
    from { box-shadow: inset 0 0 40px rgba(255, 209, 102, 0.25); }
    to { box-shadow: inset 0 0 85px rgba(255, 209, 102, 0.55); }
  }
  @keyframes pulseRed {
    from { box-shadow: inset 0 0 40px rgba(255, 42, 85, 0.3); }
    to { box-shadow: inset 0 0 90px rgba(255, 42, 85, 0.65); }
  }

  .glass {
    background: var(--bg-hud);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border-glass);
    box-shadow: var(--shadow-glow);
  }

  /* Top HUD Bar */
  #top-bar {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 16px;
    flex-wrap: wrap;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .game-badge {
    font-weight: 800;
    font-size: 0.95rem;
    letter-spacing: 0.5px;
    color: var(--accent-primary);
    text-shadow: 0 0 12px rgba(0, 240, 255, 0.35);
    white-space: nowrap;
  }
  .mode-pill {
    font-size: 0.75rem;
    padding: 3px 9px;
    border-radius: 99px;
    background: rgba(0, 240, 255, 0.14);
    border: 1px solid var(--accent-primary);
    color: var(--text-main);
    cursor: pointer;
    font-weight: 600;
  }

  .telemetry-group {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--text-muted);
  }
  .stat-chip {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--bg-btn);
    padding: 4px 8px;
    border-radius: 8px;
  }
  .stat-chip b { color: var(--text-main); font-weight: 700; }
  .stat-chip.aether b { color: var(--accent-gold); }

  .action-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .icon-btn {
    background: var(--bg-btn);
    border: 1px solid var(--border-glass);
    color: var(--text-main);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.16s ease;
    white-space: nowrap;
  }
  .icon-btn:hover {
    background: var(--bg-btn-hover);
    border-color: var(--accent-primary);
    transform: translateY(-1px);
  }
  .icon-btn.active {
    background: var(--accent-primary);
    color: #060913;
    border-color: var(--accent-primary);
    font-weight: 700;
  }
  .icon-btn.danger:hover {
    border-color: #FF4D6D;
    color: #FF4D6D;
  }

  /* Trial Status Banner */
  #trial-banner {
    position: fixed;
    top: calc(max(10px, env(safe-area-inset-top)) + 54px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 9;
    padding: 7px 16px;
    border-radius: 99px;
    display: none;
    align-items: center;
    gap: 12px;
    font-size: 0.82rem;
    border: 1px solid var(--accent-gold);
  }
  #trial-banner.visible { display: flex; }

  /* 3D Printer Progress Pill */
  #printer-banner {
    position: fixed;
    top: calc(max(10px, env(safe-area-inset-top)) + 54px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 11;
    padding: 6px 14px;
    border-radius: 99px;
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 0.8rem;
    border: 1px solid var(--accent-primary);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
  }
  #printer-banner.visible { display: flex; }

  .trial-progress-bar {
    width: 90px;
    height: 6px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 99px;
    overflow: hidden;
  }
  .trial-progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent-gold);
    transition: width 0.25s ease;
  }
  .printer-progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent-primary);
    transition: width 0.12s linear;
  }

  /* Left Tools Dock */
  #tools-dock {
    position: fixed;
    left: max(10px, env(safe-area-inset-left));
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    border-radius: 16px;
  }
  .tool-btn {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: var(--bg-btn);
    border: 1px solid transparent;
    color: var(--text-main);
    font-size: 1.02rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .tool-btn:hover {
    background: var(--bg-btn-hover);
    transform: scale(1.06);
  }
  .tool-btn.active {
    background: var(--accent-primary);
    color: #050811;
    box-shadow: 0 0 14px rgba(0, 240, 255, 0.45);
  }
  .divider-h {
    height: 1px;
    background: var(--border-glass);
    margin: 2px 0;
  }

  /* Right Speed, Camera & Slicer Dock */
  #right-dock {
    position: fixed;
    right: max(10px, env(safe-area-inset-right));
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    border-radius: 16px;
    align-items: center;
  }
  .speed-btn {
    width: 38px;
    padding: 5px 0;
    border-radius: 9px;
    background: var(--bg-btn);
    border: 1px solid transparent;
    color: var(--text-main);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .speed-btn.active {
    background: var(--accent-secondary);
    color: #FFF;
  }

  /* 3D Spatial & Slicer Floating Pill */
  #spatial-bar {
    position: fixed;
    bottom: calc(max(10px, env(safe-area-inset-bottom)) + 118px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 9;
    padding: 6px 14px;
    border-radius: 99px;
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 0.75rem;
    color: var(--text-muted);
    max-width: calc(100vw - 24px);
    overflow-x: auto;
    scrollbar-width: none;
  }
  #spatial-bar::-webkit-scrollbar { display: none; }
  #spatial-bar input[type="range"] {
    width: 64px;
    accent-color: var(--accent-primary);
    cursor: pointer;
  }

  /* Bottom Element Palette Dock */
  #bottom-dock {
    position: fixed;
    bottom: max(10px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    width: min(1020px, calc(100vw - 20px));
    z-index: 10;
    padding: 8px 12px;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .dock-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .cat-tabs {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .cat-tabs::-webkit-scrollbar { display: none; }

  .cat-tab {
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 0.75rem;
    font-weight: 600;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .cat-tab.active {
    background: var(--bg-btn-hover);
    border-color: var(--accent-primary);
    color: var(--text-main);
  }

  .brush-control {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    color: var(--text-muted);
    flex-wrap: wrap;
  }
  .brush-control input[type="range"] {
    width: 68px;
    accent-color: var(--accent-primary);
    cursor: pointer;
  }
  .shape-select {
    background: rgba(0, 240, 255, 0.12);
    color: var(--text-main);
    border: 1px solid var(--accent-primary);
    border-radius: 8px;
    padding: 3px 7px;
    font-size: 0.74rem;
    font-weight: 600;
    cursor: pointer;
    outline: none;
  }
  .shape-select.place-mode {
    background: rgba(255, 209, 102, 0.14);
    border-color: var(--accent-gold);
    color: var(--accent-gold);
  }
  .shape-select option {
    background: #0F172A;
    color: #F1F5F9;
  }

  .element-strip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: thin;
  }

  .el-btn {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 11px;
    border-radius: 11px;
    background: var(--bg-btn);
    border: 1px solid var(--border-glass);
    color: var(--text-main);
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .el-btn:hover {
    background: var(--bg-btn-hover);
    transform: translateY(-2px);
  }
  .el-btn.active {
    border-color: var(--accent-primary);
    background: rgba(0, 240, 255, 0.16);
    box-shadow: 0 0 12px rgba(0, 240, 255, 0.28);
  }
  .el-btn.locked {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .el-swatch {
    width: 12px;
    height: 12px;
    border-radius: 4px;
    display: inline-block;
    border: 1px solid rgba(255,255,255,0.3);
  }
  .cb-symbol {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    opacity: 0.85;
  }

  .hint-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.7rem;
    color: var(--text-muted);
    padding-top: 2px;
  }

  /* Toast Notification */
  #toast-container {
    position: fixed;
    top: calc(max(10px, env(safe-area-inset-top)) + 58px);
    right: max(14px, env(safe-area-inset-right));
    z-index: 30;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    background: var(--bg-panel);
    border: 1px solid var(--accent-gold);
    color: var(--text-main);
    padding: 10px 14px;
    border-radius: 12px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.82rem;
    animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    max-width: 300px;
  }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* Modal System */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(3, 6, 15, 0.74);
    backdrop-filter: blur(8px);
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    background: var(--bg-panel);
    border: 1px solid var(--border-glass);
    border-radius: 20px;
    width: min(760px, 100%);
    max-height: 85dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.65);
  }
  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-glass);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-header h2 {
    font-size: 1.1rem;
    color: var(--accent-primary);
  }
  .modal-body {
    padding: 18px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    font-size: 0.88rem;
    line-height: 1.5;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
  }
  .card-item {
    background: var(--bg-btn);
    border: 1px solid var(--border-glass);
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .card-item.unlocked { border-color: var(--accent-gold); }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    gap: 12px;
  }
  select, textarea {
    background: rgba(0,0,0,0.35);
    color: var(--text-main);
    border: 1px solid var(--border-glass);
    border-radius: 8px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 0.82rem;
  }

  /* Responsive Mobile Adjustments */
  @media (max-width: 768px) {
    .telemetry-group .hide-sm { display: none; }
    #tools-dock {
      top: auto;
      bottom: 158px;
      left: 10px;
      transform: none;
      flex-direction: row;
      padding: 4px;
      max-width: calc(100vw - 20px);
      overflow-x: auto;
    }
    #right-dock {
      top: 60px;
      right: 10px;
      transform: none;
      flex-direction: row;
      padding: 4px;
    }
    #spatial-bar {
      bottom: 116px;
      padding: 4px 10px;
    }
    .tool-btn { width: 32px; height: 32px; font-size: 0.9rem; }
    .speed-btn { width: 30px; font-size: 0.68rem; }
    .divider-h { width: 1px; height: 22px; margin: 0 2px; }
    .hint-bar { display: none; }
  }
</style>
</head>
<body>

<canvas id="gl-canvas"></canvas>
<div id="screen-vignette"></div>

<!-- Top HUD Bar -->
<header id="top-bar" class="glass">
  <div class="brand-group">
    <span class="game-badge" data-i18n="title">✦ 造物主紀元 3D</span>
    <button id="btn-mode" class="mode-pill" data-i18n="mode_sandbox">3D 自由沙盒</button>
  </div>

  <div class="telemetry-group">
    <div class="stat-chip aether" title="Aether Inspiration">
      <span>✧</span><b id="hud-aether">0</b>
    </div>
    <div class="stat-chip" title="Active 3D Voxels">
      <span data-i18n="stat_voxels">體素</span>:<b id="hud-voxels">0</b>
    </div>
    <div class="stat-chip hide-sm" title="Ambient Temperature">
      <span>🌡</span><b id="hud-temp">22°C</b>
    </div>
    <div class="stat-chip" title="Discovered Elements">
      <span>🧪</span><b id="hud-codex">10/24</b>
    </div>
    <div class="stat-chip hide-sm" id="fps-chip" style="display:none;">
      <span>FPS:</span><b id="hud-fps">60</b>
    </div>
  </div>

  <div class="action-group">
    <button class="icon-btn" id="btn-codex">📖 <span class="hide-sm" data-i18n="btn_codex">圖鑑</span></button>
    <button class="icon-btn" id="btn-trials">🎯 <span class="hide-sm" data-i18n="btn_modes">模式</span></button>
    <button class="icon-btn" id="btn-achievements">🏆 <span class="hide-sm" id="hud-ach">0/16</span></button>
    <button class="icon-btn" id="btn-settings">⚙️</button>
    <button class="icon-btn" id="btn-mute">🔊</button>
    <button class="icon-btn" id="btn-pause">⏸</button>
  </div>
</header>

<!-- Trial Status Banner -->
<div id="trial-banner" class="glass">
  <span id="trial-title" style="font-weight:700; color:var(--accent-gold);">試煉 1</span>
  <span id="trial-desc" style="color:var(--text-main);">目標描述</span>
  <div class="trial-progress-bar"><div class="trial-progress-fill" id="trial-fill"></div></div>
  <b id="trial-timer" style="font-family:var(--font-mono); color:var(--accent-primary);">60s</b>
</div>

<!-- 3D Printer Progress HUD Pill -->
<div id="printer-banner" class="glass">
  <span style="font-weight:700; color:var(--accent-primary);">🖨️ <span data-i18n="printing_label">3D 列印中</span></span>
  <span id="printer-layer-info" style="font-family:var(--font-mono);">Y: 1/8</span>
  <div class="trial-progress-bar"><div class="printer-progress-fill" id="printer-fill"></div></div>
  <b id="printer-pct" style="font-family:var(--font-mono); color:var(--accent-gold);">0%</b>
  <button class="icon-btn" id="btn-print-pause" style="padding:2px 7px; font-size:0.72rem;">⏸</button>
  <button class="icon-btn danger" id="btn-print-cancel" style="padding:2px 7px; font-size:0.72rem;">✕</button>
</div>

<!-- Left Tools Dock -->
<aside id="tools-dock" class="glass">
  <button class="tool-btn active" data-tool="brush" title="3D 建造／平面繪圖 (Build / B)">🖌️</button>
  <button class="tool-btn" data-tool="orbit" title="360° 視角旋轉模式 (Orbit / V)">🔄</button>
  <button class="tool-btn" data-tool="erase" title="空間橡皮擦 (Erase / E)">🧹</button>
  <button class="tool-btn" data-tool="eyedropper" title="3D 吸管取樣 (Eyedropper / I)">💉</button>
  <button class="tool-btn" data-tool="heat" title="立體加熱射線 (Heat Ray)">🔥</button>
  <button class="tool-btn" data-tool="cool" title="絕對零度冷凍 (Freeze Ray)">❄️</button>
  <button class="tool-btn" data-tool="vortex" title="3D 引力奇點 (Gravity Vortex)">🌀</button>
  <div class="divider-h"></div>
  <button class="tool-btn" id="btn-undo" title="時光回溯撤銷 (Undo / Ctrl+Z)">↩️</button>
  <button class="tool-btn" id="btn-redo" title="重做 (Redo / Ctrl+Y)">↪️</button>
  <button class="tool-btn" id="btn-reset" title="重置星海 (Reset / R)">🗑️</button>
</aside>

<!-- Right Speed & Apocalypse Dock -->
<aside id="right-dock" class="glass">
  <button class="speed-btn" data-speed="0">0x</button>
  <button class="speed-btn" data-speed="0.5">0.5x</button>
  <button class="speed-btn active" data-speed="1">1x</button>
  <button class="speed-btn" data-speed="2">2x</button>
  <div class="divider-h"></div>
  <button class="tool-btn" id="btn-cam-reset" title="重置 3D 攝影機視角">🎥</button>
  <button class="tool-btn" id="btn-apoc-blackhole" title="神蹟：黑洞吞噬清場">🕳️</button>
  <button class="tool-btn" id="btn-apoc-nova" title="神蹟：超新星高溫爆發">☀️</button>
  <button class="tool-btn" id="btn-apoc-rain" title="神蹟：創世高空甘霖">🌧️</button>
</aside>

<!-- 3D Spatial & Plane Lock Controls Floating Pill -->
<div id="spatial-bar" class="glass">
